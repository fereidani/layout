[package]
name = "layout"
version = "0.0.1"
edition = "2021"
rust-version = "1.71"
license = "MIT/Apache-2.0"
readme = "README.md"
description = "Optimized memory layout using struct of array, Data-oriented design in Rust, DOD SOA"
repository = "https://github.com/fereidani/layout"
homepage = "https://github.com/fereidani/layout"
documentation = "https://docs.rs/layout/"
categories = ["data-structures", "no-std"]
keywords = ["soa", "dod", "data-oriented", "struct-of-array", "performance"]

[features]
default = ["std"]
std = []
# Enable Serialize/Deserialize on Compact<T>, CompactVec<T> and the generated
# Vec when the user requests `#[layout(Serialize, Deserialize)]`.
serde = ["dep:serde"]

[workspace]
members = ["layout-internal"]

[dependencies]
branches = { version = "0.4.4", default-features = false }
layout_internal = { path = "./layout-internal", version = "0.0.1" }
serde = { version = "1", optional = true, default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
bencher = "0.1"
serde_json = "1"
itertools = "0.15.0"

[build-dependencies]
rustc_version = "0.4"

[[bench]]
name = "soa"
harness = false

[[bench]]
name = "game"
harness = false

[[bench]]
name = "perf"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
incremental = false
